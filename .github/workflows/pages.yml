# Publishes the browser version of ORIS (web/) to GitHub Pages, so it can be opened on an iPhone.
# One-time setup: repository Settings → Pages → Build and deployment → Source: "GitHub Actions".
name: Publish ORIS web app

on:
  push:
    branches: [main]
    paths: ["web/**", "fonts/**", "oris_icon.png", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble the site (web app + fonts + icon)
        run: |
          mkdir _site
          cp -r web/. _site/
          cp -r fonts _site/fonts
          cp oris_icon.png _site/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
